  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#202124;background:#f4f6f8}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f8}
    #app{max-width:760px;margin:0 auto;min-height:100vh;background:#fff;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 30px)}
    h1{font-size:27px;text-align:center;margin:4px 0 12px} h2{font-size:23px;margin:12px 0} h3{font-size:18px;margin:22px 0 8px}
    .logo{display:block;width:122px;height:122px;object-fit:contain;margin:0 auto 6px}
    .progress{text-align:center;color:#176b36;font-size:21px;font-weight:700;margin:8px 0}
    .muted{color:#666;font-size:14px;line-height:1.4}.center{text-align:center}
    button{width:100%;border:0;border-radius:12px;background:#e8edf2;color:#17212b;padding:14px 12px;margin:7px 0;font-size:17px;font-weight:600;min-height:50px}
    button.primary{background:#176b36;color:#fff}button.danger{color:#a52020}button:disabled{opacity:.45}
    .question{font-size:20px;font-weight:700;line-height:1.35;margin:14px 0}
    .option{display:flex;gap:10px;align-items:flex-start;border:1px solid #dfe3e7;border-radius:12px;padding:13px 11px;margin:9px 0;font-size:16px;line-height:1.35;background:#fff}
    .option input{width:22px;height:22px;flex:0 0 auto;margin-top:0}.option.correct{color:#18713b;font-weight:700;border-color:#83c99e;background:#f0fff5}.option.selected-wrong{color:#bd2222;font-weight:700;border-color:#e39a9a;background:#fff1f1}.option.selected-correct{color:#18713b;font-weight:700;border:2px solid #18713b;background:#edfff3}
    .result-good{color:#18713b}.result-bad{color:#bd2222}.card{border-top:1px solid #ddd;padding-top:12px;margin-top:14px}.badge{font-size:13px;font-weight:700}
    .sticky{position:sticky;top:calc(env(safe-area-inset-top));background:#fff;padding:5px 0 8px;z-index:2}
    .award{border:1px solid #d2d2d2;border-radius:14px;padding:14px;margin:10px 0;background:#f7f7f7;color:#5a5a5a;line-height:1.45}
    .award.unlocked{border:2px solid #83c99e;background:#f0fff5;color:#18713b}.award-title{font-size:18px;font-weight:700}
  </style>

<script>
window.addEventListener('error', function(e){
  var app=document.getElementById('app');
  if(app){
    app.innerHTML='<h1 style="color:#b00020">Ошибка запуска</h1><pre id="startupError" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>';
    document.getElementById('startupError').textContent=(e.message||'Неизвестная ошибка')+'\nСтрока: '+(e.lineno||'?');
  }
});
window.addEventListener('unhandledrejection', function(e){
  var app=document.getElementById('app');
  if(app){
    app.innerHTML='<h1 style="color:#b00020">Ошибка запуска</h1><pre id="startupError" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>';
    document.getElementById('startupError').textContent=String(e.reason||e);
  }
});
// Удаляем регистрацию и кэши старых версий сайта.
window.addEventListener('load', function(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(list){
      list.forEach(function(reg){reg.unregister();});
    }).catch(function(){});
  }
  if('caches' in window){
    caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k);});}).catch(function(){});
  }
});
</script>

// Исправление вопроса о государственном строительном надзоре:
// часть со статьёй 49 объединяется с частью про Градостроительный кодекс.
(function fixArticle49Answer(){
  const q=QUESTIONS.find(x=>{
    const t=String(x.text||'').toLowerCase().replaceAll('ё','е');
    return t.includes('государствен')&&t.includes('строительн')&&t.includes('надзор');
  });
  if(!q)return;
  let article=-1,code=-1;
  q.options.forEach((o,i)=>{
    const t=String(o).toLowerCase().replaceAll('ё','е');
    if(article<0&&t.includes('49')&&t.includes('стат'))article=i;
    if(code<0&&t.includes('градостроитель')&&t.includes('кодекс'))code=i;
  });
  if(article<0||code<0||article===code)return;
  const wasCorrect=q.correct.includes(article)||q.correct.includes(code);
  q.options[article]=(q.options[article].trim()+' '+q.options[code].trim()).trim();
  q.options.splice(code,1);
  const adjusted=[];
  for(const old of q.correct){
    if(old===code)continue;
    adjusted.push(old>code?old-1:old);
  }
  const mergedIndex=article>code?article-1:article;
  if(wasCorrect&&!adjusted.includes(mergedIndex))adjusted.push(mergedIndex);
  q.correct=[...new Set(adjusted)].sort((a,b)=>a-b);
})();

const $app=document.getElementById('app');
// Ключ оставлен прежним, чтобы сохранить прогресс после обновления PWA.
const KEY='rostekhnadzor_pwa_state_v1';
let state=loadState();
let batch=[],pos=0,mode='regular',returnScreen='start';

function loadState(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'{}');
    return {
      learned:Array.isArray(x.learned)?x.learned:[],
      wrong:Array.isArray(x.wrong)?x.wrong:[],
      unseen:Array.isArray(x.unseen)?x.unseen:[],
      learnedQueue:Array.isArray(x.learnedQueue)?x.learnedQueue:[],
      solved:Array.isArray(x.solved)?x.solved:[],
      correctStreak:Number.isFinite(x.correctStreak)?x.correctStreak:0,
      learnedCorrectTotal:Number.isFinite(x.learnedCorrectTotal)?x.learnedCorrectTotal:0,
      awards:x.awards&&typeof x.awards==='object'?x.awards:{},
      initialized:!!x.initialized,
      solvedMigrated:!!x.solvedMigrated
    };
  }catch(e){return {learned:[],wrong:[],unseen:[],learnedQueue:[],solved:[],correctStreak:0,learnedCorrectTotal:0,awards:{},initialized:false,solvedMigrated:false};}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function unique(a){return [...new Set(a)];}
function byId(id){return QUESTIONS.find(q=>q.id===id);}
function allIds(){return shuffle(QUESTIONS.map(q=>q.id));}
function scrollToPageTop(){window.scrollTo(0,0);}
function btn(label,fn,cls='',disabled=false){const b=document.createElement('button');b.textContent=label;b.className=cls;b.disabled=disabled;b.onclick=fn;return b;}
function add(el){$app.appendChild(el);return el;}
function text(tag,value,cls=''){const e=document.createElement(tag);e.textContent=value;e.className=cls;return e;}
function clear(){ $app.innerHTML=''; scrollToPageTop(); }

function cleanState(){
  const valid=new Set(QUESTIONS.map(q=>q.id));
  state.learned=unique(state.learned.filter(id=>valid.has(id)));
  state.wrong=unique(state.wrong.filter(id=>valid.has(id)));
  state.unseen=unique(state.unseen.filter(id=>valid.has(id)));
  state.learnedQueue=unique((state.learnedQueue||[]).filter(id=>valid.has(id)&&state.learned.includes(id)));
  state.solved=unique((state.solved||[]).filter(id=>valid.has(id)));
  if(!state.solvedMigrated){
    state.solved=unique([...state.solved,...state.learned,...state.wrong]);
    state.solvedMigrated=true;
  }
  syncLearnedQueue();
}

function syncLearnedQueue(){
  const learnedSet=new Set(state.learned);
  const queue=unique((state.learnedQueue||[]).filter(id=>learnedSet.has(id)&&byId(id)));
  const added=shuffle(state.learned.filter(id=>byId(id)&&!queue.includes(id)));
  state.learnedQueue=[...queue,...added];
  return state.learnedQueue;
}
function updateLearnedQueueAfterTest(){
  let queue=[...syncLearnedQueue()];
  const tested=new Set(batch.map(a=>a.q.id));
  const passed=shuffle(batch.filter(a=>a.correct&&state.learned.includes(a.q.id)).map(a=>a.q.id));
  queue=queue.filter(id=>!tested.has(id));
  state.learnedQueue=unique([...queue,...passed]);
}
const AWARDS=[
  ['streak_10','🔥','Искра знаний','Ответить правильно на 10 вопросов подряд.'],
  ['streak_15','⚡','На волне','Ответить правильно на 15 вопросов подряд.'],
  ['streak_20','🚀','Железная серия','Ответить правильно на 20 вопросов подряд.'],
  ['streak_30','👑','Эксперт без ошибок','Ответить правильно на 30 вопросов подряд.'],
  ['streak_50','🐉','Легенда Ростехнадзора','Ответить правильно на 50 вопросов подряд.'],
  ['learned_20','🧠','Разминка мастера','Правильно решить 20 вопросов в тестах по выученным.'],
  ['learned_40','🎓','Повторение — сила','Правильно решить 40 вопросов в тестах по выученным.'],
  ['learned_80','🏅','Хранитель знаний','Правильно решить 80 вопросов в тестах по выученным.'],
  ['solved_half','🗺️','Половина пути','Ответить хотя бы один раз на половину всей базы.'],
  ['solved_all','🏆','Покоритель базы','Ответить хотя бы один раз на каждый вопрос базы.']
];
function unlockAward(key,newAwards){
  if(!state.awards[key]){state.awards[key]=true;const a=AWARDS.find(x=>x[0]===key);if(a)newAwards.push(a[1]+' '+a[2]);}
}
function checkAwards(newAwards){
  for(const n of [10,15,20,30,50])if(state.correctStreak>=n)unlockAward('streak_'+n,newAwards);
  for(const n of [20,40,80])if(state.learnedCorrectTotal>=n)unlockAward('learned_'+n,newAwards);
  if(state.solved.length>=Math.ceil(QUESTIONS.length/2))unlockAward('solved_half',newAwards);
  if(state.solved.length>=QUESTIONS.length)unlockAward('solved_all',newAwards);
}
function showPrizes(){
  clear();
  add(text('h1','🏆 Призы и достижения'));
  add(text('div',`Получено: ${AWARDS.filter(a=>state.awards[a[0]]).length} из ${AWARDS.length}`,'progress'));
  let group='';
  AWARDS.forEach((a,i)=>{
    const next=i<5?'Серия правильных ответов подряд':i<8?'Повторение уже выученных вопросов':'Прохождение базы';
    if(next!==group){group=next;add(text('h3',group));}
    const card=document.createElement('div');card.className='award'+(state.awards[a[0]]?' unlocked':'');
    card.appendChild(text('div',a[1]+'  '+a[2],'award-title'));
    card.appendChild(text('div',state.awards[a[0]]?'Получено ✓':'Пока не получено'));
    card.appendChild(text('div',a[3]));add(card);
  });
  add(btn('На стартовую страницу',showStart));
}

function showStart(){
  cleanState();save();clear();
  const img=document.createElement('img');img.src='icon.png';img.className='logo';img.alt='Ростехнадзор';add(img);
  add(text('h1','Тест ростехнадзор'));
  add(text('div',`Выучено: ${state.learned.length} из ${QUESTIONS.length}`,'progress'));
  add(text('div',`Ошибок для повторения: ${state.wrong.length}`,'muted center'));
  if(state.learned.length===QUESTIONS.length&&state.wrong.length===0){
    add(text('div','Все вопросы выучены. Обычный тест продолжится новым случайным кругом, а прогресс останется полным.','muted center'));
  }
  add(btn('Начать тест: новые вопросы и ошибки',()=>startBatch('regular'),'primary'));
  add(btn('Тест по ранее правильным вопросам',()=>startBatch('learned'),'',state.learned.length===0));
  if(!state.learned.length)add(text('div','Кнопка станет доступна после первого правильного ответа.','muted center'));
  add(btn('Все вопросы по порядку',()=>showAll('start')));
  add(btn('🏆 Призы и достижения',showPrizes));
  add(btn('Сбросить весь прогресс',resetProgress,'danger'));
}
function startBatch(newMode){
  mode=newMode;batch=[];pos=0;cleanState();let chosen=[];
  if(mode==='learned'){
    const queue=syncLearnedQueue();
    chosen=queue.filter(id=>byId(id)).slice(0,10);
    if(!chosen.length){alert('Пока нет ранее правильно отвеченных вопросов');showStart();return;}
  }else{
    if(!state.initialized){state.unseen=allIds();state.initialized=true;}
    for(const id of shuffle(state.wrong)){
      if(chosen.length>=10)break;
      if(byId(id)&&!chosen.includes(id))chosen.push(id);
    }
    for(const id of state.unseen){
      if(chosen.length>=10)break;
      if(byId(id)&&!chosen.includes(id))chosen.push(id);
    }
    if(chosen.length===0){
      state.unseen=allIds();
      for(const id of state.unseen){if(chosen.length>=10)break;chosen.push(id);}
    }
    state.unseen=state.unseen.filter(id=>!chosen.includes(id));
    save();
  }
  batch=chosen.map(id=>{const q=byId(id);return {q,selected:[],order:shuffle(q.options.map((_,i)=>i)),correct:false};});
  showQuestion();
}
function showQuestion(){
  if(pos>=batch.length){grade();return;}
  clear();const a=batch[pos];
  add(text('div',`Вопрос ${pos+1} из ${batch.length}`,'muted'));
  add(text('div',a.q.text,'question'));
  if(a.q.correct.length>1)add(text('div','Можно выбрать несколько вариантов.','muted'));
  const boxes=[];
  for(const index of a.order){
    const label=document.createElement('label');label.className='option';
    const input=document.createElement('input');input.type='checkbox';input.checked=a.selected.includes(index);input.dataset.index=index;
    const span=document.createElement('span');span.textContent=a.q.options[index];label.append(input,span);add(label);boxes.push(input);
  }
  add(btn(pos===batch.length-1?'Завершить тест':'Следующий вопрос',()=>{
    a.selected=boxes.filter(x=>x.checked).map(x=>Number(x.dataset.index));
    if(!a.selected.length){alert('Выберите ответ');return;}pos++;showQuestion();
  },'primary'));
  add(btn('Все вопросы по порядку',()=>showAll('question')));
  add(btn('На стартовую страницу',()=>{if(confirm('Прервать текущий тест? Ответы не будут учтены.'))showStart();}));
}

function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x));}
function grade(){
  const newAwards=[];
  for(const a of batch){
    a.correct=sameSet(a.selected,a.q.correct);
    state.solved=unique([...state.solved,a.q.id]);
    if(a.correct){
      state.wrong=state.wrong.filter(id=>id!==a.q.id);
      state.learned=unique([...state.learned,a.q.id]);
      state.correctStreak++;
      if(mode==='learned')state.learnedCorrectTotal++;
    }else{
      state.wrong=unique([...state.wrong,a.q.id]);
      state.learned=state.learned.filter(id=>id!==a.q.id);
      state.correctStreak=0;
    }
  }
  if(mode==='learned')updateLearnedQueueAfterTest();else syncLearnedQueue();
  checkAwards(newAwards);save();showResults();
  if(newAwards.length)setTimeout(()=>alert('Новый приз!\n\n'+newAwards.join('\n')),50);
}
function showResults(){
  clear();const good=batch.filter(a=>a.correct).length;
  add(text('h1',`Результат: ${good} из ${batch.length}`));
  add(text('div',`Выучено: ${state.learned.length} из ${QUESTIONS.length}`,'progress'));
  add(text('div','Зелёный — правильный ответ. Красный — выбранный неправильный ответ. Показаны все варианты ответа.','muted'));
  batch.forEach((a,i)=>{
    const card=document.createElement('section');card.className='card';
    const h=text('h3',`${i+1}. ${a.correct?'Правильно':'Неправильно'} — ${a.q.text}`,a.correct?'result-good':'result-bad');card.appendChild(h);
    for(const idx of a.order){
      const selected=a.selected.includes(idx),correct=a.q.correct.includes(idx);let mark='';
      if(selected&&correct)mark=' — ВЫБРАН, ПРАВИЛЬНЫЙ';else if(correct)mark=' — ПРАВИЛЬНЫЙ';else if(selected)mark=' — ВЫБРАН';
      const row=text('div','• '+a.q.options[idx]+mark,'option '+(selected&&correct?'selected-correct':correct?'correct':selected?'selected-wrong':''));card.appendChild(row);
    }
    add(card);
  });
  add(text('div','Правильный ответ сохраняет вопрос в выученных. В тесте по выученным правильно решённые вопросы перемещаются в конец круговой очереди, поэтому сначала попадутся остальные. Неправильный ответ переносит вопрос в ошибки и уменьшает прогресс.','muted'));
  add(btn(mode==='learned'?'Ещё тест по выученным':'Следующие вопросы',()=>startBatch(mode),'primary'));
  add(btn('На стартовую страницу',showStart));
  add(btn('Все вопросы по порядку',()=>showAll('results')));
}

function letter(i){return ['А','Б','В','Г','Д','Е','Ж','З','И','К'][i]||(i+1);}
function showAll(back){
  returnScreen=back;clear();
  const bar=document.createElement('div');bar.className='sticky';bar.appendChild(text('h1','Все вопросы по порядку'));bar.appendChild(btn('Назад',returnFromAll));add(bar);
  [...QUESTIONS].sort((a,b)=>a.sourceNumber-b.sourceNumber||a.id-b.id).forEach(q=>{
    const card=document.createElement('section');card.className='card';card.appendChild(text('h3',`${q.sourceNumber}. ${q.text}`));
    q.options.forEach((o,i)=>card.appendChild(text('div',`${letter(i)}) ${o}`,'option '+(q.correct.includes(i)?'correct':''))));
    add(card);
  });
  add(btn('Назад',returnFromAll));
}
function returnFromAll(){if(returnScreen==='results')showResults();else if(returnScreen==='question')showQuestion();else showStart();}
function resetProgress(){if(confirm('Удалить выученные вопросы, ошибки, очередь и достижения?')){state={learned:[],wrong:[],unseen:[],learnedQueue:[],solved:[],correctStreak:0,learnedCorrectTotal:0,awards:{},initialized:false,solvedMigrated:true};save();showStart();}}

showStart();
// Service Worker отключён в версии v7.
</script></body></html>
