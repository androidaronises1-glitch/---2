<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Тест Ростехнадзор">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Тест ростехнадзор — GitHub v5</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#202124;background:#f4f6f8}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f8}
    #app{max-width:760px;margin:0 auto;min-height:100vh;background:#fff;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 30px)}
    h1{font-size:27px;text-align:center;margin:4px 0 12px} h2{font-size:23px;margin:12px 0} h3{font-size:18px;margin:22px 0 8px}
    .logo{display:block;width:122px;height:122px;object-fit:contain;margin:0 auto 6px}
    .progress{text-align:center;color:#176b36;font-size:21px;font-weight:700;margin:8px 0}
    .muted{color:#666;font-size:14px;line-height:1.4}.center{text-align:center}
    button{width:100%;border:0;border-radius:12px;background:#e8edf2;color:#17212b;padding:14px 12px;margin:7px 0;font-size:17px;font-weight:600;min-height:50px}
    button.primary{background:#176b36;color:#fff}button.danger{color:#a52020}button:disabled{opacity:.45}
    .question{font-size:20px;font-weight:700;line-height:1.35;margin:14px 0}
    .option{display:flex;gap:10px;align-items:flex-start;border:1px solid #dfe3e7;border-radius:12px;padding:13px 11px;margin:9px 0;font-size:16px;line-height:1.35;background:#fff}
    .option input{width:22px;height:22px;flex:0 0 auto;margin-top:0}.option.correct{color:#c51e1e;font-weight:700;border-color:#e7a4a4;background:#fff5f5}.option.selected-wrong{color:#2456b4;font-weight:700;border-color:#9fb4df;background:#f3f7ff}.option.selected-correct{color:#c51e1e;font-weight:700;border:2px solid #c51e1e;background:#fff2f2}
    .result-good{color:#18713b}.result-bad{color:#bd2222}.card{border-top:1px solid #ddd;padding-top:12px;margin-top:14px}.badge{font-size:13px;font-weight:700}
    .sticky{position:sticky;top:calc(env(safe-area-inset-top));background:#fff;padding:5px 0 8px;z-index:2}
  </style>
</head>
<body><main id="app"></main>
<script>
let QUESTIONS=[];
const $app=document.getElementById('app');
// Ключ оставлен прежним, чтобы сохранить прогресс после обновления PWA.
const KEY='rostekhnadzor_pwa_state_v1';
let state=loadState();
let batch=[],pos=0,mode='regular',returnScreen='start';

function loadState(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'{}');
    return {
      learned:Array.isArray(x.learned)?x.learned:[],
      wrong:Array.isArray(x.wrong)?x.wrong:[],
      unseen:Array.isArray(x.unseen)?x.unseen:[],
      initialized:!!x.initialized
    };
  }catch(e){return {learned:[],wrong:[],unseen:[],initialized:false};}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function unique(a){return [...new Set(a)];}
function byId(id){return QUESTIONS.find(q=>q.id===id);}
function allIds(){return shuffle(QUESTIONS.map(q=>q.id));}
function top(){window.scrollTo(0,0);}
function btn(label,fn,cls='',disabled=false){const b=document.createElement('button');b.textContent=label;b.className=cls;b.disabled=disabled;b.onclick=fn;return b;}
function add(el){$app.appendChild(el);return el;}
function text(tag,value,cls=''){const e=document.createElement(tag);e.textContent=value;e.className=cls;return e;}
function clear(){ $app.innerHTML=''; top(); }

function cleanState(){
  const valid=new Set(QUESTIONS.map(q=>q.id));
  state.learned=unique(state.learned.filter(id=>valid.has(id)));
  state.wrong=unique(state.wrong.filter(id=>valid.has(id)));
  state.unseen=unique(state.unseen.filter(id=>valid.has(id)));
}

function showStart(){
  cleanState();save();clear();
  const img=document.createElement('img');img.src='icon.png';img.className='logo';img.alt='Ростехнадзор';add(img);
  add(text('h1','Тест ростехнадзор'));
  add(text('div',`Выучено: ${state.learned.length} из ${QUESTIONS.length}`,'progress'));
  add(text('div',`Ошибок для повторения: ${state.wrong.length}`,'muted center'));
  if(state.learned.length===QUESTIONS.length && state.wrong.length===0){
    add(text('div','Все вопросы выучены. Обычный тест продолжится новым случайным кругом, а прогресс останется полным.','muted center'));
  }
  add(btn('Начать тест: новые вопросы и ошибки',()=>startBatch('regular'),'primary'));
  add(btn('Тест по ранее правильным вопросам',()=>startBatch('learned'),'',state.learned.length===0));
  if(!state.learned.length)add(text('div','Кнопка станет доступна после первого правильного ответа.','muted center'));
  add(btn('Все вопросы по порядку',()=>showAll('start')));
  add(btn('Сбросить весь прогресс',resetProgress,'danger'));
}

function startBatch(newMode){
  mode=newMode;batch=[];pos=0;cleanState();let chosen=[];
  if(mode==='learned'){
    chosen=shuffle(state.learned.filter(id=>byId(id))).slice(0,10);
    if(!chosen.length){alert('Пока нет ранее правильно отвеченных вопросов');showStart();return;}
  }else{
    // Первый запуск: создаём очередь из всех вопросов.
    if(!state.initialized){
      state.unseen=allIds();
      state.initialized=true;
    }

    // Сначала берём ошибки, затем ещё не показанные вопросы текущего круга.
    for(const id of shuffle(state.wrong)){
      if(chosen.length>=10)break;
      if(byId(id) && !chosen.includes(id))chosen.push(id);
    }
    for(const id of state.unseen){
      if(chosen.length>=10)break;
      if(byId(id) && !chosen.includes(id))chosen.push(id);
    }

    // Новый круг запускается только после полного завершения текущей очереди
    // и отсутствия ошибок. Список выученных при этом не сбрасывается.
    if(chosen.length===0){
      state.unseen=allIds();
      for(const id of state.unseen){
        if(chosen.length>=10)break;
        chosen.push(id);
      }
    }

    // Выбранные вопросы исключаем из очереди текущего круга.
    state.unseen=state.unseen.filter(id=>!chosen.includes(id));
    save();
  }
  batch=chosen.map(id=>{const q=byId(id);return {q,selected:[],order:shuffle(q.options.map((_,i)=>i)),correct:false};});
  showQuestion();
}

function showQuestion(){
  if(pos>=batch.length){grade();return;}
  clear();const a=batch[pos];
  add(text('div',`Вопрос ${pos+1} из ${batch.length}`,'muted'));
  add(text('div',a.q.text,'question'));
  if(a.q.correct.length>1)add(text('div','Можно выбрать несколько вариантов.','muted'));
  const boxes=[];
  for(const index of a.order){
    const label=document.createElement('label');label.className='option';
    const input=document.createElement('input');input.type='checkbox';input.checked=a.selected.includes(index);input.dataset.index=index;
    const span=document.createElement('span');span.textContent=a.q.options[index];label.append(input,span);add(label);boxes.push(input);
  }
  add(btn(pos===batch.length-1?'Завершить тест':'Следующий вопрос',()=>{
    a.selected=boxes.filter(x=>x.checked).map(x=>Number(x.dataset.index));
    if(!a.selected.length){alert('Выберите ответ');return;}pos++;showQuestion();
  },'primary'));
  add(btn('Все вопросы по порядку',()=>showAll('question')));
  add(btn('На стартовую страницу',()=>{if(confirm('Прервать текущий тест? Ответы не будут учтены.'))showStart();}));
}

function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x));}
function grade(){
  for(const a of batch){
    a.correct=sameSet(a.selected,a.q.correct);
    if(a.correct){
      state.wrong=state.wrong.filter(id=>id!==a.q.id);
      state.learned=unique([...state.learned,a.q.id]);
    }else{
      state.wrong=unique([...state.wrong,a.q.id]);
      state.learned=state.learned.filter(id=>id!==a.q.id);
    }
  }
  save();showResults();
}

function showResults(){
  clear();const good=batch.filter(a=>a.correct).length;
  add(text('h1',`Результат: ${good} из ${batch.length}`));
  add(text('div',`Выучено: ${state.learned.length} из ${QUESTIONS.length}`,'progress'));
  add(text('div','Красный — правильный ответ. Синий — выбранный неправильный. Показаны все варианты ответа.','muted'));
  batch.forEach((a,i)=>{
    const card=document.createElement('section');card.className='card';
    const h=text('h3',`${i+1}. ${a.correct?'Правильно':'Неправильно'} — ${a.q.text}`,a.correct?'result-good':'result-bad');card.appendChild(h);
    for(const idx of a.order){
      const selected=a.selected.includes(idx),correct=a.q.correct.includes(idx);let mark='';
      if(selected&&correct)mark=' — ВЫБРАН, ПРАВИЛЬНЫЙ';else if(correct)mark=' — ПРАВИЛЬНЫЙ';else if(selected)mark=' — ВЫБРАН';
      const row=text('div','• '+a.q.options[idx]+mark,'option '+(selected&&correct?'selected-correct':correct?'correct':selected?'selected-wrong':''));card.appendChild(row);
    }
    add(card);
  });
  add(text('div','Правильный ответ сохраняет вопрос в выученных. Неправильный ответ переносит вопрос в ошибки и уменьшает прогресс. После изучения всех вопросов начинается новый случайный круг без сброса прогресса.','muted'));
  add(btn(mode==='learned'?'Ещё тест по выученным':'Следующие вопросы',()=>startBatch(mode),'primary'));
  add(btn('На стартовую страницу',showStart));
  add(btn('Все вопросы по порядку',()=>showAll('results')));
}

function letter(i){return ['А','Б','В','Г','Д','Е','Ж','З','И','К'][i]||(i+1);}
function showAll(back){
  returnScreen=back;clear();
  const bar=document.createElement('div');bar.className='sticky';bar.appendChild(text('h1','Все вопросы по порядку'));bar.appendChild(btn('Назад',returnFromAll));add(bar);
  add(text('div','Порядок сохранён как в исходном документе. Правильные ответы выделены красным.','muted'));
  [...QUESTIONS].sort((a,b)=>a.sourceNumber-b.sourceNumber||a.id-b.id).forEach(q=>{
    const card=document.createElement('section');card.className='card';card.appendChild(text('h3',`${q.sourceNumber}. ${q.text}`));
    q.options.forEach((o,i)=>card.appendChild(text('div',`${letter(i)}) ${o}`,'option '+(q.correct.includes(i)?'correct':'')));
    add(card);
  });
  add(btn('Назад',returnFromAll));
}
function returnFromAll(){if(returnScreen==='results')showResults();else if(returnScreen==='question')showQuestion();else showStart();}
function resetProgress(){if(confirm('Удалить выученные вопросы, ошибки и очередь текущего круга?')){state={learned:[],wrong:[],unseen:[],initialized:false};save();showStart();}}

(async function loadQuestions(){
  try{
    const response=await fetch('./questions.json?v=5',{cache:'no-store'});
    if(!response.ok)throw new Error('questions.json: HTTP '+response.status);
    QUESTIONS=await response.json();
    if(!Array.isArray(QUESTIONS)||QUESTIONS.length===0)throw new Error('Список вопросов пуст');
    showStart();
  }catch(error){
    const app=document.getElementById('app');
    app.innerHTML='<h1 style="color:#b00020">Ошибка запуска</h1><p>Не удалось загрузить вопросы.</p><pre style="white-space:pre-wrap"></pre>';
    app.querySelector('pre').textContent=String(error && (error.stack||error.message)||error);
  }
})();
// Service Worker временно отключён, чтобы старый кэш не мешал проверке GitHub Pages.
</script></body></html>
